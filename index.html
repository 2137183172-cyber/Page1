<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能助手</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Helvetica Neue", Arial, sans-serif;
      background: #f7f8fa;
    }

    #chat-float-btn {
      position: fixed;
      right: 20px;
      bottom: 100px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #07c160, #06ad56);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
      cursor: pointer;
      z-index: 9999;
      animation: pulse 2s infinite;
      user-select: none;
    }

    #chat-container {
      position: fixed;
      right: 20px;
      bottom: 180px;
      width: 380px;
      height: 600px;
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.2);
      display: none;
      z-index: 9998;
    }

    #close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 10000;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.08);
      color: #333;
      text-align: center;
      line-height: 28px;
      cursor: pointer;
      font-size: 16px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @media (max-width: 768px) {
      #chat-container {
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        border-radius: 0;
      }

      #chat-float-btn {
        right: 16px;
        bottom: 88px;
      }
    }
  </style>
</head>
<body>
  <div id="chat-float-btn">💬</div>

  <div id="chat-container">
    <div id="close-btn">×</div>
    <div id="coze-chat" style="width:100%;height:100%;"></div>
  </div>

  <script src="https://sf-cdn.coze.com/coze-web-sdk.js"></script>
  <script>
    let client = null;

    const floatBtn = document.getElementById("chat-float-btn");
    const chatContainer = document.getElementById("chat-container");
    const closeBtn = document.getElementById("close-btn");

    function openChat() {
      chatContainer.style.display = "block";

      if (!client) {
        client = new CozeWebSDK.WebChatClient({
          config: {
            bot_id: "wx9d23744c3bee7e74"
          },
          componentProps: {
            container: "#coze-chat"
          }
        });
      }
    }

    function closeChat() {
      chatContainer.style.display = "none";
    }

    floatBtn.addEventListener("click", openChat);
    closeBtn.addEventListener("click", closeChat);
  </script>
</body>
</html>
